name: "✨ Feature Request"
description: "Suggest an idea, extension, or improvement for Vats Editor."
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a feature request for **Vats Editor**!

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: What part of the project would this feature affect?
      options:
        - "Core Headless Package (packages/headless)"
        - "New Tiptap Extension / Node"
        - "Bubble Toolbar / Slash Command Menu"
        - "Image & Media Pipeline"
        - "Tailwind & Theme System"
        - "Markdown / Serialization"
        - "Web Demo / Documentation"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: "I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the solution you would like to see, including code examples or proposed component props if applicable.
      placeholder: |
        ```tsx
        <EditorRoot>
          <EditorContent extensions={[MyNewExtension]} />
        </EditorRoot>
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, references to competitor libraries (e.g. Notion, BlockNote, Lexical), or mockups here.
    validations:
      required: false
