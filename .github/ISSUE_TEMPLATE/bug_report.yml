name: "🐞 Bug Report"
description: "File a bug report with reproduction details to help us fix issues."
title: "fix: "
labels: ["bug", "unconfirmed"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in **Vats Editor**! Please fill in this report with as much detail as possible.

  - type: dropdown
    id: package
    attributes:
      label: Affected Package / Component
      description: Which area of Vats Editor does this issue affect?
      options:
        - "packages/headless (vats core)"
        - "apps/web (demo app)"
        - "extensions (Twitter, Mathematics, UpdatedImage, etc.)"
        - "plugins (UploadImagesPlugin, etc.)"
        - "ui / selectors (Bubble menu, Slash command, Math popover)"
        - "styles (Tailwind CSS, ProseMirror CSS)"
        - "other / documentation"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open the editor
        2. Type '/math' or paste an image
        3. See error
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Reproduction Repository / Link
      description: Please provide a public GitHub repo or StackBlitz/CodeSandbox reproduction link if possible.
      placeholder: "https://github.com/your-username/vats-reproduction"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Paste the output of `npx envinfo --system --binaries --browsers` or specify OS, browser, Next.js, and package versions.
      value: |
        - OS: [e.g. macOS 15, Ubuntu 24.04, Windows 11]
        - Browser: [e.g. Chrome 130, Safari 18, Firefox 132]
        - Node version: [e.g. 20.x, 22.x]
        - Package Manager: [e.g. pnpm, npm, yarn]
        - Vats version: [e.g. 1.0.0]
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Context
      description: Add any other context, console errors, stack traces, or screenshots here.
    validations:
      required: false
